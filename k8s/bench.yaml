# The bench agent: MiNiFi C++ 2.26.09 + minifi_tensor, C2 off, limited to 6 CPU / 3Gi like an
# 8 GB Jetson Orin Nano. The flow and drop-ins come from ConfigMap minifi-detect-conf (k8s/apply.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: minifi-detect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minifi-detect-bench
  namespace: minifi-detect
  labels: {app: minifi-detect-bench}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: minifi-detect-bench}
  template:
    metadata:
      labels: {app: minifi-detect-bench}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
      - name: minifi
        image: minifi-detect:2.26.09-b42
        imagePullPolicy: IfNotPresent
        env:
        - {name: WORK_DIR, value: /tmp/minifi-detect}
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "6", memory: 3Gi}
        volumeMounts:
        - {name: conf, mountPath: /conf, readOnly: true}
        - {name: work, mountPath: /tmp/minifi-detect}
        # the agent logs to logs/minifi-app.log, not stdout; an emptyDir keeps it through a crash
        - {name: logs, mountPath: /home/minifi/minifi-cpp-2.26.09/logs}
      volumes:
      - name: conf
        configMap: {name: minifi-detect-conf}
      - name: work
        emptyDir: {sizeLimit: 4Gi}
      - name: logs
        emptyDir: {sizeLimit: 256Mi}
